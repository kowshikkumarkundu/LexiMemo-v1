
name: LexiMemo Phase 6 Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LexiMemo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"

      - name: Extract Phase 6 Project
        run: |
          unzip -q LexiMemo_Phase6_Dictionary_Collections.zip -d .

      - name: Verify Gradle Project
        run: |
          test -f LexiMemo/settings.gradle.kts
          test -f LexiMemo/app/build.gradle.kts

      - name: Build Debug APK
        run: |
          gradle --no-daemon -p LexiMemo assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LexiMemo-Phase6-Debug-APK
          path: LexiMemo/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
