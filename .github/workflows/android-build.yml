
name: LexiMemo Phase 5 Android Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LexiMemo APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle 8.13
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 5. Install Android SDK 36
      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"

      # 6. Extract Phase 5 ZIP
      - name: Extract Phase 5 Project
        run: |
          unzip -q LexiMemo_Phase5_RevisionEngine.zip -d .

      # 7. Verify Project
      - name: Verify Gradle Project
        run: |
          test -f LexiMemo/settings.gradle.kts
          test -f LexiMemo/app/build.gradle.kts

      # 8. Build Debug APK
      - name: Build Debug APK
        run: |
          gradle --no-daemon -p LexiMemo assembleDebug --stacktrace

      # 9. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LexiMemo-Phase5-Debug-APK
          path: LexiMemo/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
