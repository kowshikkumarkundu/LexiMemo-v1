name: LexiMemo Android APK Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - '*.zip'
      - '.github/workflows/**'

  workflow_dispatch:
    inputs:
      zip_file:
        description: 'Project ZIP filename in repository root'
        required: true
        default: 'LexiMemo-UI-Fixes-v4.zip'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build LexiMemo Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Tools
        id: android
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK sdkmanager not found."
            echo "Available SDK directories:"
            ls -la "$ANDROID_HOME"
            ls -la "$ANDROID_HOME/cmdline-tools" || true
            exit 1
          fi

          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "Found SDK Manager: $SDKMANAGER"

      - name: Install Android SDK Components
        shell: bash
        run: |
          SDKMANAGER="${{ steps.android.outputs.sdkmanager }}"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Locate Project ZIP
        id: project
        shell: bash
        env:
          ZIP_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.zip_file || 'LexiMemo-Phase7-Image-Tap-Hint-Fix.zip' }}
        run: |
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found: $ZIP_FILE"
            echo "Available ZIP files:"
            ls -la *.zip || true
            exit 1
          fi

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Using ZIP: $ZIP_FILE"

      - name: Extract Project ZIP
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.project.outputs.zip_file }}" -d extracted

          echo "Extracted project structure:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Verify Android Project
        id: verify
        shell: bash
        run: |
          PROJECT_DIR="extracted/LexiMemo"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::LexiMemo project root not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app Gradle file missing."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project verification successful."

      - name: Set Up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Build Environment
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build Debug APK
        shell: bash
        run: |
          gradle --no-daemon \
            -p "${{ steps.verify.outputs.project_dir }}" \
            assembleDebug \
            --stacktrace

      - name: Verify APK
        id: apk
        shell: bash
        run: |
          APK_PATH="${{ steps.verify.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK file was not generated."
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

          echo "APK generated successfully:"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LexiMemo-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LexiMemo-Build-Reports
          path: |
            extracted/LexiMemo/app/build/reports/
            extracted/LexiMemo/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
